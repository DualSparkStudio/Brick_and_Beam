[dev]
  command = "npm run dev:vite"
  port = 8765
  targetPort = 8766
  autoLaunch = false

[build]
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/calendar/feed.ics"
  to = "/.netlify/functions/calendar-feed"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

# Custom domain 301 redirect (Uncomment when custom domain is configured in Netlify):
# [[redirects]]
#   from = "https://brickandbeamvilla.netlify.app/*"
#   to = "https://YOUR_CUSTOM_DOMAIN/:splat"
#   status = 301
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "unload=(), geolocation=(), microphone=(), camera=()" 